contentful:
  spaces:
    - lf:
        space: ENV_CONTENTFUL_SPACE_ID
        access_token: ENV_CONTENTFUL_ACCESS_TOKEN
        base_path: ./
        destination: /contentful
        all_entries: true
        client_options:
          max_include_resolution_depth: 2
          reuse_entries: false
        rich_text_mappings:
          embedded-entry-block: EmbeddedEntryBlockRenderer
          embedded-asset-block: EmbeddedAssetBlockRenderer
    - index:
        space: ENV_CONTENTFUL_SPACE_ID
        access_token: ENV_CONTENTFUL_ACCESS_TOKEN
        base_path: ./
        destination: /contentful
        all_entries: true
        cda_query:
          content_type: index
        client_options:
          reuse_entries: false
        rich_text_mappings:
          embedded-entry-block: EmbeddedEntryBlockRenderer
          embedded-asset-block: EmbeddedAssetBlockRenderer
    - nav:
        space: ENV_CONTENTFUL_SPACE_ID
        access_token: ENV_CONTENTFUL_ACCESS_TOKEN
        base_path: ./
        destination: /contentful
        all_entries: true
        cda_query:
          content_type: navigation
        client_options:
          max_include_resolution_depth: 5
          reuse_entries: false
        rich_text_mappings:
          embedded-entry-block: EmbeddedEntryBlockRenderer
          embedded-asset-block: EmbeddedAssetBlockRenderer

plugins:
  - jekyll-postcss-v2

postcss:
  cache: false

page_gen:
  - data: 'data.contentful.lf.news'
    template: 'announcement'
    name: 'pretty_url'
    dir: 'post'
  - data: 'data.contentful.lf.people'
    template: 'profile'
    name: 'pretty_url'
    dir: 'people'

